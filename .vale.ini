; Prose linting for documentation, guides, backlog prose and the generated README.
;
;   vale --config .vale.ini --no-global README.md AGENTS.md CONTRIBUTING.md CHANGELOG.md docs pyshellforge/README.md automation/features backlog
;
; The Microsoft style package is vendored under .vale/styles/Microsoft, so the
; check runs offline and in the sandbox without `vale sync` (see
; .vale/styles/README.md for how the vendored copy is refreshed).
;
; Errors fail the check; warnings are advisory and reviewed during review.
StylesPath = .vale/styles
MinAlertLevel = warning
Vocab = Project
Packages = Microsoft

[*.md]
BasedOnStyles = Vale, Microsoft
; Project terminology is managed in the vocabulary, not by the Terms rule.
Vale.Terms = NO
Vale.Spelling = YES

; --- documented Microsoft-rule exclusions ---------------------------------- ;
; Contractions: reference documentation keeps a neutral, translation-friendly
; voice. Expanding "isn't" to "is not" is unambiguous for readers whose first
; language is not English, which matters for an API reference.
Microsoft.Contractions = NO
; Avoid: Microsoft's A-Z word list targets user-interface copy. "backend" is the
; domain term of this project and matches the pyshellforge.backends package.
Microsoft.Avoid = NO
; Headings here name the API surface (CLI, API, AST, PSF, README); spelling the
; acronym out would be less precise, not more.
Microsoft.HeadingAcronyms = NO

[backlog/*.md]
; Backlog prose is working material: the same styles apply, but the editorial
; rules that police tone are relaxed so task notes stay direct.
BasedOnStyles = Vale, Microsoft
Vale.Spelling = YES
Microsoft.Contractions = NO
Microsoft.Avoid = NO
Microsoft.Adverbs = NO

[automation/features/*.feature]
; Gherkin is a structured language, not prose: only spelling is enforced.
BasedOnStyles = Vale
Vale.Terms = NO
Vale.Spelling = YES
