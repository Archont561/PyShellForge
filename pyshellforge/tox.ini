# Multi-version test matrix for the distribution.
#
#   pixi run test-matrix        # every interpreter installed locally
#   pixi run test-matrix-one    # the default interpreter
#   tox -e lint,typecheck       # ruff and mypy over the whole repository
#   tox -e coverage             # merge per-interpreter coverage, then report
#
# The file sits in the project directory because that is where tox finds the
# manifest it has to build: `pixi run test-matrix` invokes
# `python -m tox -c pyshellforge/tox.ini` from the repository root.
#
# CI runs one environment per matrix cell (see .github/workflows/ci.yml), so
# the OS x Python grid comes from GitHub and the isolation comes from tox:
# every environment builds the package into its own virtualenv, which is what a
# user installing from PyPI experiences.
#
# Pixi remains the day-to-day runner (`pixi run test-all`); tox answers the
# different question "does the package build and pass on this interpreter?".

[tox]
requires =
    tox>=4.20
env_list =
    py311
    py312
    py313
    py314
    lint
    typecheck
skip_missing_interpreters = true

[testenv]
description = Run the test suite on {base_python}
# Build the wheel and install it with the dev extra, exactly as a user would
# install a release plus its test dependencies.
package = wheel
extras = dev
# Per-interpreter data files, merged by `tox -e coverage`. The coverage
# configuration stays at the repository root because it also covers automation/.
setenv =
    COVERAGE_FILE = {toxworkdir}/.coverage.{env_name}
    COVERAGE_RCFILE = {toxinidir}/../.coveragerc
# `..` is the repository root: the automation suite lives outside the project.
changedir = {toxinidir}
commands =
    pytest tests ../automation/tests -q \
        --cov --cov-report=term-missing --cov-report=xml:{toxworkdir}/coverage-{env_name}.xml \
        {posargs}

[testenv:lint]
description = Ruff lint and format check over the repository
skip_install = true
deps = ruff>=0.6
changedir = {toxinidir}/..
commands =
    ruff check .
    ruff format --check .

[testenv:typecheck]
description = Static types for the package, the automation and the suite
changedir = {toxinidir}/..
deps = mypy>=1.11
commands = mypy --config-file pyshellforge/pyproject.toml

[testenv:coverage]
description = Merge per-interpreter coverage and enforce fail_under
skip_install = true
changedir = {toxinidir}/..
deps =
    coverage[toml]>=7.5
setenv =
    COVERAGE_FILE = {toxworkdir}/.coverage
    COVERAGE_RCFILE = {toxinidir}/../.coveragerc
commands =
    coverage combine {toxworkdir}
    coverage report
    coverage xml -o coverage.xml
