[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

# The distribution lives in this directory: the package under src/, its test
# suite, its Gherkin features and this manifest. Everything repository-scoped
# (docs/, automation/, CI, the Pixi environment) stays at the repository root and
# builds, tests and checks this project from there.
[project]
name = "pyshellforge"
version = "0.1.0"
description = "A Python-native DSL for building, composing and rendering structured Bash scripts."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "PyShellForge contributors" }]
keywords = [
    "python",
    "bash",
    "shell",
    "shell-script",
    "code-generation",
    "compiler",
    "transpiler",
    "dsl",
    "ast",
    "developer-tools",
    "automation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Unix Shell",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Compilers",
    "Topic :: System :: Shells",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    # 9 emits every step definition as a fixture, which is how the automation
    # suite registers its step modules; the Pixi environment pins the same major.
    "pytest-bdd>=9,<10",
    "pytest-cov>=5.0",
    "hypothesis>=6.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "build>=1.2",
    "tox>=4.20",
    # Issue-form validation (automation.forms) reads YAML.
    "pyyaml>=6.0",
    "types-pyyaml>=6.0",
    # The README banner is FIGlet art (automation.banner), rendered, not pasted.
    "pyfiglet>=1.0.4,<2",
    # Clean Code rules: rude is the linter, rude-clean-code the rule plugin.
    "rude>=0.1a4,<0.2",
    "rude-clean-code>=0.1,<0.2",
]
# Documentation tooling: repository policy and Gherkin style. markdownlint-cli2,
# Vale and lychee are standalone binaries wired through Pixi (see pixi.toml).
docs = [
    "alint>=0.20",
    "gherlint>=0.5",
    # automation.forms validates the GitHub Issue Forms.
    "pyyaml>=6.0",
    # automation.readme renders the banner, and CI checks the README here.
    "pyfiglet>=1.0.4,<2",
]

[project.urls]
Homepage = "https://github.com/Archont561/PyShellForge"
Documentation = "https://github.com/Archont561/PyShellForge/tree/main/docs"
Repository = "https://github.com/Archont561/PyShellForge"
Issues = "https://github.com/Archont561/PyShellForge/issues"
Changelog = "https://github.com/Archont561/PyShellForge/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/pyshellforge"]

[tool.hatch.build.targets.sdist]
# The sdist carries what the suite needs if it is ever unpacked and tested:
include = ["src", "tests", "features", "README.md"]

# Run from the repository root with an explicit configuration file:
#   python -m pytest -c packages/pyshellforge/pyproject.toml               # the product suite
#   python -m pytest -c packages/pyshellforge/pyproject.toml ../automation/tests
# `pythonpath` is resolved against this file, so "src" is the package tree and
# "../.." is the repository root the suites import `automation` from. The automation
# suite brings its own conftest: its scenarios and step definitions live beside
# the automation, outside this rootdir.
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src", "../.."]
addopts = "-ra --strict-markers"
markers = [
    "integration: end-to-end rendering and shell syntax checks",
    "shellcheck: requires the shellcheck binary",
    "tooling: automation scenarios (automation/features/)",
    "product: product behaviour scenarios (packages/pyshellforge/features/)",
]

# ruff configuration: ../../ruff.toml
# coverage configuration: ../../.coveragerc

# Clean Code linting: `python -m automation.clean_code` runs
#   python -m rude check --config packages/pyshellforge/pyproject.toml <paths>
# over the same trees mypy checks. Only the CC family is selected, because ruff
# owns everything else; the rules come from the rude-clean-code plugin, which
# rude discovers through its `rude.plugins` entry point.
[tool.rude]
select = ["CC"]

[tool.rude.rules.CC101]
# The rule counts the whole definition: signature, docstring and blank lines.
# Every function in this repository carries a docstring, so 60 keeps a function
# to one operation while leaving room for the prose that explains it.
max_lines = 60

# Types are checked with `mypy --config-file packages/pyshellforge/pyproject.toml` from the
# repository root; mypy resolves these paths against the working directory.
[tool.mypy]
python_version = "3.11"
files = ["packages/pyshellforge/src", "packages/pyshellforge-rude/src", "automation", "dodo.py"]
# `src/` layout: name the module base explicitly so `src/pyshellforge` is checked
# as `pyshellforge`, not `pyshellforge.src.pyshellforge`. The second entry is the
# BDD step directory, whose modules the suite imports by bare name.
mypy_path = "packages/pyshellforge/src:packages/pyshellforge-rude/src:automation/tests/bdd"
explicit_package_bases = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
check_untyped_defs = true
strict_equality = true
